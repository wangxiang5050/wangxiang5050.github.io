<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>测试摇一摇</title>
</head>
<body>
<div class="phone">
  <button onclick="getPermission()">请求授权</button>
  <div id="show"></div>
</div>
</body>

<script>
function init () {
      
      navigator.vibrate =
        navigator.vibrate ||
        navigator.webkitVibrate ||
        navigator.mozVibrate ||
        navigator.msVibrate
      if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', function(e){
            // alert('摇动中')
            document.getElementById("show").innerHTML = new Date() + "," + JSON.stringify(e)
        }, false)
      } else {
        alert('不支持')
      }
      if (window.DeviceOrientationEvent) {
        window.addEventListener(
          'deviceorientation',
          function(){
            // alert('摇动中')
            document.getElementById("show").innerHTML = new Date() + "," + JSON.stringify(e)
          },
          false
        )
      } else {
        alert('不支持')
      }
    }
    init()
</script>
</html>
